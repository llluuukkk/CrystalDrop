                          <span className={`px-2.5 py-1 rounded-md text-xs font-semibold ${e.type === 'CREDIT' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>{e.type}</span>
                        </td>
                        <td className="px-6 py-4"><p className="text-sm text-white">{e.desc}</p><p className="text-xs text-gray-500 font-mono">{e.id}</p></td>
                        <td className={`px-6 py-4 text-right font-semibold ${e.amount >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{e.amount >= 0 ? '+' : ''}{fmt(Math.abs(e.amount))} CR</td>
                        <td className="px-6 py-4 text-right text-gray-400 hidden md:table-cell">{fmt(e.bal)} CR</td>
                        <td className="px-6 py-4 text-right text-gray-500 text-sm hidden sm:table-cell">{new Date(e.date).toLocaleString()}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'deposits' && (
              <div className="rounded-2xl border border-white/5 overflow-hidden bg-dark-700/40">
                <table className="w-full">
                  <thead>
                    <tr className="border-b border-white/5 text-left text-xs uppercase tracking-wider text-gray-500">
                      <th className="px-6 py-4">Status</th>
                      <th className="px-6 py-4">Amount</th>
                      <th className="px-6 py-4">Crypto</th>
                      <th className="px-6 py-4 hidden lg:table-cell">Tx</th>
                      <th className="px-6 py-4 text-right">Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    {deposits.map(d => (
                      <tr key={d.id} className="border-b border-white/5 hover:bg-white/[0.02]">
                        <td className="px-6 py-4">
                          <span className={`px-2.5 py-1 rounded-md text-xs font-semibold ${STATUS_CLS[d.status] || STATUS_CLS.EXPIRED}`}>{d.status}</span>
                        </td>
                        <td className="px-6 py-4 font-semibold text-white">{fmt(d.amount)} CR</td>
                        <td className="px-6 py-4 text-gray-300">{Number(d.cryptoAmt).toFixed(6)} {d.currency}{d.network ? <span className="block text-[11px] text-gray-500">{d.network}</span> : null}</td>
                        <td className="px-6 py-4 hidden lg:table-cell font-mono text-xs text-gray-500">{d.tx || '—'}</td>
                        <td className="px-6 py-4 text-right text-gray-500 text-sm">{new Date(d.created).toLocaleString()}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>}

            </main>
          </div>
          
          {toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl bg-dark-500 text-white text-sm shadow-2xl border border-white/10">{toast}</div>}
          {showFair && <FairModal onClose={() => setShowFair(false)} />}
      {showChat && <ChatPanel onClose={() => setShowChat(false)} acct={acct} onNeedAcct={() => setAuthMode('signup')} onTip={n => setTipTo(n)} />}
      {tipTo !== null && <TipModal onClose={() => setTipTo(null)} to0={tipTo} send={sendTip} balance={wallet.balance} />}
      {showDeposit && <DepositModal onClose={() => { setShowDeposit(false); setResumeId(null); }} onCreated={onCreated} deposits={deposits} simulate={simulate} resumeId={resumeId} walletId={wallet.id} acct={acct} openAuth={setAuthMode} refreshAcct={refreshAcct} />}
          {pop === 'profile' && <ProfileModal onClose={() => setPop(null)} id={wallet.id} name={dispName} acct={acct} />}
          {authMode && <AuthModal mode0={authMode} onClose={() => setAuthMode(null)} onAuthed={onAuthed} resetToken={resetTok} />}
        </div>
      );
    }


    // ---- anti-bot gate ----  Shown once per browser (24 h). With window.CD_TURNSTILE_KEY set it uses Cloudflare Turnstile and the deposit server checks the token;
    // without it, a built-in picture challenge runs in the browser. A browser-only check only stops simple scripts: real protection needs the Turnstile mode.
    const BOT_TS = () => { try { return (DEP_API && (window.CD_TURNSTILE_KEY || localStorage.getItem('cd_turnstile_key'))) || ''; } catch (e) { return ''; } };
    const humanHdr = () => { try { const t = localStorage.getItem('cd_human_tok'); return t ? { 'X-Human': t } : {}; } catch (e) { return {}; } };
    const BOT = { KEY: 'cd_human', ok() { try { const t = +localStorage.getItem(this.KEY); return t && Date.now() - t < 864e5 && (!BOT_TS() || !!localStorage.getItem('cd_human_tok')); } catch (e) { return false; } }, set() { try { localStorage.setItem(this.KEY, String(Date.now())); } catch (e) {} } };
    const BOT_SHAPES = ['diamond', 'circle', 'square', 'triangle', 'hexagon'];
    const BotShape = ({ k, c }) => <svg viewBox="0 0 40 40" width="44" height="44" fill="none" stroke={c} strokeWidth="3" strokeLinejoin="round">{k === 'diamond' ? <path d="M20 4l14 16-14 16L6 20z" /> : k === 'circle' ? <circle cx="20" cy="20" r="14" /> : k === 'square' ? <rect x="7" y="7" width="26" height="26" rx="3" /> : k === 'triangle' ? <path d="M20 5l15 28H5z" /> : <path d="M12 6h16l9 14-9 14H12L3 20z" />}</svg>;
    function BotGate({ onDone }) {
      const mk = () => { const r = new Uint32Array(12); crypto.getRandomValues(r); const target = BOT_SHAPES[r[0] % 5]; let tiles = Array.from({ length: 9 }, (_, i) => ({ k: BOT_SHAPES[r[i + 1] % 5], c: ['#6ee7b7', '#7dd3fc', '#fcd34d', '#f9a8d4'][r[i + 1] % 4] }));
        if (!tiles.some(t => t.k === target)) tiles[r[10] % 9].k = target; return { target, tiles }; };
      const [ch, setCh] = useState(mk); const [sel, setSel] = useState([]); const [err, setErr] = useState(''); const [t0] = useState(Date.now()); const hp = useRef(null);
      const TS = BOT_TS(); const tsRef = useRef(null);
      useEffect(() => { if (!TS) return; const sc = document.createElement('script'); sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.async = true;
        sc.onload = () => { window.turnstile.render(tsRef.current, { sitekey: TS, theme: 'dark', callback: async tok => { try { if (DEP_API) { const r = await fetch(DEP_API + '/captcha/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tok }) }); const j = await r.json(); if (!j.ok) throw new Error('rejected'); if (j.pass) localStorage.setItem('cd_human_tok', j.pass); } BOT.set(); onDone(); } catch (e) { setErr('Verification failed. Try again.'); window.turnstile.reset(); } } }); };
        document.head.appendChild(sc); return () => sc.remove(); }, []);
      const toggle = i => setSel(s => s.includes(i) ? s.filter(x => x !== i) : [...s, i]);
      const check = () => { const want = ch.tiles.map((t, i) => t.k === ch.target ? i : -1).filter(i => i >= 0), good = want.length === sel.length && want.every(i => sel.includes(i));
        if (hp.current && hp.current.value) return setErr('Verification failed.'); if (Date.now() - t0 < 1200) { setErr('Too fast. Take a moment and try again.'); setSel([]); return; }
        if (!good) { setErr('Not quite. Try a new set.'); setSel([]); setCh(mk()); return; } BOT.set(); onDone(); };
      return <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-dark-900"><div className="w-full max-w-sm rounded-3xl border border-white/10 bg-dark-700 p-6 shadow-2xl text-center">
        <h1 className="text-xl font-bold text-white font-display">Quick check</h1><p className="text-sm text-gray-400 mt-1">Confirm you are a person to enter CrystalDrop.gg.</p>
        {TS ? <div className="mt-5 flex justify-center" ref={tsRef} /> : <>
        <p className="mt-5 text-sm text-gray-200">Select every <span className="font-bold text-accent">{ch.target}</span></p>
        <div className="grid grid-cols-3 gap-2 mt-3">{ch.tiles.map((t, i) => <button key={i} type="button" aria-label={'Tile ' + (i + 1)} aria-pressed={sel.includes(i)} onClick={() => toggle(i)} className={'h-20 rounded-xl border flex items-center justify-center ' + (sel.includes(i) ? 'border-accent bg-accent/10' : 'border-white/10 bg-dark-600 hover:border-white/25')}><BotShape k={t.k} c={t.c} /></button>)}</div>
        <input ref={hp} tabIndex={-1} autoComplete="off" aria-hidden="true" name="website" style={{ position: 'absolute', left: '-9999px', opacity: 0 }} />
        <button type="button" onClick={check} className="mt-4 w-full py-3 rounded-xl bg-accent text-dark-900 font-bold hover:bg-accent-dim">Verify</button></>}
        {err && <p className="text-sm text-rose-400 mt-3" role="alert">{err}</p>}
      </div></div>; }
    function Root() { const [h, setH] = useState(() => BOT.ok()); return h ? <App /> : <BotGate onDone={() => setH(true)} />; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
